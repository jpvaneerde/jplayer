<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f111a" id="theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>JPlay</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <script>
    // Theme before first paint, so the page doesn't flash: saved choice, else the device's.
    (function () {
      var t = null;
      try { t = localStorage.getItem("jplay.theme"); } catch (e) {}
      if (t !== "dark" && t !== "light" && t !== "retro") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.className = t;
    })();
  </script>
</head>
<body>
  <div class="app">
    <section class="deck" aria-label="Now playing">
      <header class="deck-head">
        <div class="brand">
          <svg class="logo" id="logo" viewBox="0 0 150 44" role="img" aria-label="JPlay">
            <g class="bars">
              <rect class="b1" x="2" y="22" width="7" height="16" rx="3.5"/>
              <rect class="b2" x="13" y="8" width="7" height="30" rx="3.5"/>
              <rect class="b3" x="24" y="15" width="7" height="23" rx="3.5"/>
            </g>
            <text x="42" y="35" font-size="32" font-weight="800" letter-spacing="-0.5">J<tspan class="accent" dx="2">Play</tspan></text>
          </svg>
          <h1 class="player-name" id="player-name">JPlay</h1>
        </div>
        <div class="head-right">
          <button class="out-btn" id="out-btn" title="Choose the DAC"><span id="link-state" class="link-state">Connecting</span></button>
          <button class="theme-btn" id="theme-btn" aria-label="Theme">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18zm0 2v14a7 7 0 0 0 0-14z" fill-rule="evenodd"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </header>

      <div class="np card">
        <div class="np-art nocover"><img id="np-art" alt="" hidden></div>
        <div class="np-text">
          <div class="np-counters">
            <span class="np-track" id="np-track" aria-label="Track"></span>
            <span class="np-time" id="np-time" aria-label="Elapsed time">--:--</span>
          </div>
          <p class="np-title" id="np-title">Nothing playing</p>
          <p class="np-sub" id="np-artist"></p>
          <p class="np-sub dim" id="np-album"></p>
          <p class="np-status" id="np-status"></p>
        </div>
      </div>

      <div class="seek">
        <input type="range" id="seek" min="0" max="100" step="0.5" value="0" aria-label="Position" disabled>
        <div class="seek-times"><span id="pos">0:00</span><span id="dur"></span></div>
      </div>

      <div class="transport" role="group" aria-label="Transport">
        <button class="key" id="btn-previous" aria-label="Previous" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 5h2.2v14H6zM19 5v14l-9.5-7z"/></svg>
        </button>
        <button class="key key-main" id="btn-toggle" aria-label="Play" disabled>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
        </button>
        <button class="key" id="btn-next" aria-label="Next" disabled>
          <svg viewBox="0 0 24 24"><path d="M15.8 5H18v14h-2.2zM5 5l9.5 7L5 19z"/></svg>
        </button>
        <button class="key" id="btn-stop" aria-label="Stop" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>

      <label class="volume" id="volume-row" hidden>
        <span>Volume</span>
        <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume">
        <output id="volume-out"></output>
      </label>
    </section>

    <section class="browser" aria-label="Sources">
      <nav class="selector" id="selector" role="tablist" aria-label="Sources"></nav>
      <div class="panel" id="panel" role="tabpanel"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
