# Tests for the Home Assistant integration (custom_components/jplay), in a real Home Assistant.
# They need their own environment, separate from JPlay's:
#   python3 -m venv /tmp/havenv && /tmp/havenv/bin/pip install pytest-homeassistant-custom-component
#   /tmp/havenv/bin/python -m pytest -c tests_homeassistant/pytest.ini tests_homeassistant
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = ..
